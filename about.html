<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi sitio con Bootstrap</title>

  <!-- Bootstrap NO se descarga: se carga desde Internet -->
  <!-- CDN = el navegador pide Bootstrap a otro servidor -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<!-- bg-light es una clase de Bootstrap -->
<body class="bg-light">

    <!-- Header fijo con navegación -->
  <header class="bg-primary text-white sticky-top">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <h1 class="h4 m-0">Mi sitio</h1>

      <nav class="d-flex gap-3">
        <a href="index.html" class="text-white text-decoration-none">Inicio</a>
        <a href="about.html" class="text-white text-decoration-none">Acerca</a>
        <a href="contact.html" class="text-white text-decoration-none">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- container centra y limita el ancho del contenido -->
  <main class="container py-5">

    <!-- Esta sección ya tiene estilo sin CSS propio -->
    <section class="bg-white p-4 rounded-4 shadow-sm">
      <h2>Museo Jumex</h2>
      <a href="https://www.fundacionjumex.org/es" target="_blank"><img src="resources/_GLR4388.jpg"
      alt="museos"
      class="img-fluid rounded-3">
    </a>
     

<iframe width="560" height="315" src="https://www.youtube.com/embed/WPPX5MLL8y4?si=DpqPNG0ed5J8w8L8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </main>

</body>
</html>
