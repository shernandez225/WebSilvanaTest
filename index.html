<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi sitio con navegación</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
    <!--Aquí puedo usar mi propia hoja de estilos-->
    <link rel="stylesheet" href="styles.css">
    
</head>

<body class="bg-secondary bg-opacity-10">

  <!-- Header fijo con navegación -->
  <header class="bg-primary text-white sticky-top">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <h1 class="h4 m-0">Mi sitio</h1>

      <nav class="d-flex gap-3">
        <a href="#inicio" class="text-white text-decoration-none">Inicio</a>
        <a href="about.html" class="text-white text-decoration-none">Acerca</a>
        <a href="#contacto" class="text-white text-decoration-none">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container py-5">

    <section id="inicio" class="p-4 rounded-4 shadow-sm border-start border-4 border-primary">
      <h2 class="text-primary">Inicio</h2>
      <p>Mensaje principal del sitio.</p>
    </section>

    <section id="acerca" class="mt-4 bg-light p-4 rounded-4 shadow-sm border-start border-4 border-success">
      <h2 class="text-success">Acerca</h2>
      <p>Información sobre el proyecto o el autor.</p>
    </section>

    <section id="contacto" class="mt-4 bg-white p-4 rounded-4 shadow-sm border-start border-4 border-dark">
      <h2 class="text-dark">Contacto</h2>
      <p>correo@ejemplo.com</p>
    </section>

  </main>

  <footer class="bg-dark">
    <div class="container py-3 text-center text-light">
      <small>© 2026 · Mi sitio</small>
    </div>
  </footer>

</body>
</html>
